version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-triage_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-triage_password}
      POSTGRES_DB: ${POSTGRES_DB:-triage_assistant}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-triage_user} -d ${POSTGRES_DB:-triage_assistant}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_HOST: db
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-triage_user}:${POSTGRES_PASSWORD:-triage_password}@db:5432/${POSTGRES_DB:-triage_assistant}
      # --- IntelOwl Threat Intelligence integration ---
      # All INTELOWL_* values (incl. the token) are provided by env_file
      # (./backend/.env) above. Do NOT re-declare them here: an
      # `environment:` entry would override env_file and blank the token.
      # IntelOwl is reached on the host via host.docker.internal (extra_hosts below).
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/app/data/chroma
    extra_hosts:
      # Lets the backend reach a local Ollama server via host.docker.internal
      # when LLM_PROVIDER=ollama. Harmless when LLM_PROVIDER=openai.
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
  chroma_data:
